  <style>
    :root { --ground: #efeee7; --ink: #141612; --block: #101611; --ink-2: #3d413b; --ink-3: #61655e; --rule: #cfcdc5; --rule-2: #b4b2a9; --on: #f2f1ea; --tab: #d3d5cf; --lime: #9bd62a; color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; min-height: 100svh;
      display: grid; grid-template-columns: minmax(0, 1fr);
      background: var(--ground); color: var(--ink);
      font: 400 16px/1.6 Inter, "Helvetica Neue", Arial, sans-serif;
    }
    main { display: grid; grid-template-columns: minmax(0, 260px) minmax(0, 1fr); gap: 0 56px; align-self: center; width: min(1040px, 100%); margin: 0 auto; padding: 64px 24px; }
    .block { position: relative; align-self: start; display: grid; align-content: end; min-height: 172px; padding: 22px 18px 16px; background: var(--block); color: var(--on); font-family: Montserrat, sans-serif; }
    .block::after { content: ""; position: absolute; top: 12px; right: 12px; width: 7px; height: 7px; border-radius: 50%; background: #c4c8c0; }
    .tab { position: absolute; top: -11px; left: 18px; padding: 6px 10px 5px; background: var(--tab); color: var(--ink-2); font: 600 10px/1 Montserrat, sans-serif; letter-spacing: .14em; text-transform: uppercase; }
    .code { font: 800 58px/.86 Montserrat, sans-serif; letter-spacing: -.01em; }
    .name { margin-top: 12px; font: 600 10.5px/1.3 Montserrat, sans-serif; letter-spacing: .1em; text-transform: uppercase; color: #c4c8c0; }
    .body { padding-left: 56px; border-left: 1px solid var(--rule-2); }
    .role { margin: 0 0 8px; font: 600 11px/1.2 Montserrat, sans-serif; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }
    h1 { margin: 0; font: 800 clamp(40px, 6vw, 72px)/.9 Montserrat, sans-serif; letter-spacing: -.02em; text-transform: uppercase; }
    .hair { height: 1px; margin: 18px 0 12px; background: var(--ink); }
    .path { margin: 0; font: 500 12px/1.4 Montserrat, sans-serif; letter-spacing: .06em; color: var(--ink-2); overflow-wrap: anywhere; }
    p.note { margin: 28px 0 32px; max-width: 40ch; font-size: 18px; line-height: 1.45; }
    a.btn { display: inline-flex; align-items: center; gap: 14px; min-height: 48px; padding: 0 20px; border: 1px solid var(--block); background: var(--block); color: var(--on); text-decoration: none; font: 600 12px/1 Montserrat, sans-serif; letter-spacing: .12em; text-transform: uppercase; transition: background-color .2s, color .2s; }
    a.btn:hover { background: transparent; color: var(--ink); }
    a.btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
    @media (max-width: 720px) {
      main { grid-template-columns: minmax(0, 1fr); gap: 40px; }
      .block { max-width: 252px; }
      .body { padding-left: 0; border-left: 0; }
    }
  </style>

      <p class="path" id="path">This address</p>
      <p class="note">Nothing lives at this address. The portfolio is a single page, so head back to the index.</p>
      <a class="btn" id="home" href="/">Back to the index <span aria-hidden="true">→</span></a>
    </div>

  <script>
    document.getElementById('path').textContent = location.pathname;
  </script>
