# Checks every push and pull request, and deploys `main` to GitHub Pages (bobzheng.com).
# One-time setup: Settings → Pages → Source: "GitHub Actions".
name: Check and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the published files
        # Only what the site needs. README, .idea and _archive are never published.
        run: |
          mkdir _site
          cp -r index.html 404.html assets _site/

      - name: Validate HTML
        run: npx --yes html-validate@9 index.html 404.html

      - name: Check internal links and anchors
        run: python3 .github/scripts/check_links.py _site

      - name: Upload the site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
